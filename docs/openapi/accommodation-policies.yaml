rate-policies-collection:
  get:
    tags: [Accommodation Rate Policies]
    summary: Listar políticas de tarifas
    parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/OffsetParam'
      - name: accommodation_id
        in: query
        schema: { type: integer }
      - name: rate_type
        in: query
        schema:
          type: string
          enum: [flexible, semi_flexible, non_refundable]
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccommodationRatePolicyCollection'

  post:
    tags: [Accommodation Rate Policies]
    summary: Crear política de tarifa
    description: Única por alojamiento + rate_type.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreAccommodationRatePolicyRequest'
    responses:
      '201':
        description: Creada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccommodationRatePolicyResponse'
      '422':
        $ref: '#/components/responses/ValidationError'

  delete:
    tags: [Accommodation Rate Policies]
    summary: Eliminar política de tarifa
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [accommodation_rate_policy_id]
            properties:
              accommodation_rate_policy_id:
                type: integer
                example: 1
    responses:
      '200':
        description: Eliminada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccommodationRatePolicyResponse'

rate-policies-item:
  get:
    tags: [Accommodation Rate Policies]
    summary: Obtener política de tarifa
