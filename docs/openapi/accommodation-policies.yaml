collection:
  get:
    tags: [Accommodation Policies]
    summary: Listar políticas de alojamiento
    parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/OffsetParam'
      - name: accommodation_id
        in: query
        schema: { type: integer }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccommodationPolicyCollection'

  post:
    tags: [Accommodation Policies]
    summary: Crear política de alojamiento
    description: Única por alojamiento (unique accommodation_id).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreAccommodationPolicyRequest'
    responses:
      '201':
        description: Creada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccommodationPolicyResponse'
      '422':
        $ref: '#/components/responses/ValidationError'

  delete:
    tags: [Accommodation Policies]
    summary: Eliminar política de alojamiento
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [accommodation_policy_id]
            properties:
              accommodation_policy_id:
                type: integer
                example: 1
    responses:
      '200':
        description: Eliminada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccommodationPolicyResponse'

item:
  get:
    tags: [Accommodation Policies]
    summary: Obtener política de alojamiento
    parameters:
      - $ref: '#/components/parameters/IdPath'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccommodationPolicyResource'

  put:
    tags: [Accommodation Policies]
    summary: Actualizar política de alojamiento
    parameters:
      - $ref: '#/components/parameters/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateAccommodationPolicyRequest'
    responses:
      '200':
        description: Actualizada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccommodationPolicyResponse'
      '422':
        $ref: '#/components/responses/ValidationError'

