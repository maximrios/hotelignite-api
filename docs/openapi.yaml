        email:           { type: string, format: email, nullable: true }
        phone:           { type: string, nullable: true }
        web:             { type: string, format: uri, nullable: true }
        ota:             { type: boolean, nullable: true }
        commission_rate: { type: number, minimum: 0, maximum: 100, nullable: true }
        enabled:         { type: boolean }

    # -----------------------------------------------------------------------
    # SERVICE
    # -----------------------------------------------------------------------
    ServiceResource:
      type: object
      description: |
        **No expone `slug`**: la tabla `services` no tiene esa columna (venía
        siempre en `null`).
      properties:
        id:   { type: integer, example: 1 }
        name: { type: string, example: "WiFi" }
        icon:
          type: string
          nullable: true
          example: "<i class=\"fa fa-wifi\"></i>"
          description: |
            Alias de la columna legacy `ico`, que guarda **HTML crudo de Font
            Awesome**, no un nombre de ícono. Se reporta `null` cuando está vacía
            o cuando conserva el `'0'` que trae por default.
        type:
          type: string
          enum: [general, room, bathroom, accessibility, kitchen]
          example: room
        is_highlighted: { type: boolean, example: false }
        enabled:        { type: boolean, example: true }
        qty:            { type: integer, example: 12, description: "Alojamientos que usan este servicio" }

    ServiceCollection:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ServiceResource' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    StoreServiceRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 255
          example: "WiFi"
          description: |
            **Único en la tabla.** La collation de MySQL es case-insensitive, así
            que "WiFi" choca con "Wifi".
        type:
          type: string
          enum: [general, room, bathroom, accessibility, kitchen]
          example: general
        icon:           { type: string, nullable: true, maxLength: 255, description: "HTML del ícono; `null` se guarda como cadena vacía" }
        is_highlighted: { type: boolean, default: false }
        enabled:        { type: boolean, default: false }

    UpdateServiceRequest:
      type: object
      description: Todos los campos son opcionales; el `unique` de `name` ignora la fila que se edita.
      properties:
        name:           { type: string, minLength: 3, maxLength: 255 }
        type:
          type: string
          enum: [general, room, bathroom, accessibility, kitchen]
        icon:           { type: string, nullable: true, maxLength: 255 }
        is_highlighted: { type: boolean }
        enabled:        { type: boolean }

