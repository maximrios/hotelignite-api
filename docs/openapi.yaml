openapi: 3.0.3
info:
  title: HotelIgnite API
  description: |
    API REST del PMS HotelIgnite. Todos los endpoints bajo `/api/v1/` requieren autenticación
    Bearer (Laravel Sanctum) excepto donde se indique lo contrario.

    > **Este documento cubre solo `/api/v1`.** La superficie `/api/admin/v1` —
    > la que consumen el PMS, el CRM y el portal de clients, y la única con
    > `PATCH` de alojamiento — está en **`docs/openapi-admin.yaml`**.

    **Convenciones:**
    - `DELETE` recibe el ID en el body (no en la URL), salvo `Channels` que usa `DELETE /channels/{id}` (apiResource estándar de Laravel).
    - `GET index` devuelve colección paginada con `data` + `meta`.
    - Precios (`price`) se almacenan en **centavos** (integer). Ej: `15000` = $150.00 ARS.
    - Disponibilidad y tarifas soportan **upsert bulk por rango de fechas** en `POST`.

    **Archivos de paths por dominio** (en `docs/openapi/`):
    - `rooms.yaml` — Habitaciones físicas
    - `room-types.yaml` — Tipos, descripciones, servicios y camas
    - `rate-plans.yaml` — Planes tarifarios
    - `rates.yaml` — Tarifas diarias
    - `room-availability.yaml` — Disponibilidad
    - `channels.yaml` — Canales de distribución
    - `services.yaml` — Servicios y amenities
    - `accommodation-policies.yaml` — Políticas, traducciones y tarifas de cancelación
    - `bookings.yaml` — Pre-reservas y reservas confirmadas
    - `inquiries.yaml` — Consultas (leads) del motor web
  version: "1.0.0"

servers:
  - url: /api/v1
    description: API v1

security:
  - sanctum: []

tags:
  - name: Accommodations
    description: Alojamientos — ficha principal, búsqueda y disponibilidad
  - name: Accommodation Services
    description: Relación muchos-a-muchos entre alojamientos y servicios
  - name: Rooms
    description: Habitaciones físicas individuales
  - name: Room Types
    description: Tipos de habitación de un alojamiento
  - name: Room Type Descriptions
    description: Descripciones multilenguaje de tipos de habitación
  - name: Room Type Services
    description: Servicios asociados a tipos de habitación
  - name: Room Type Beds
    description: Configuración de camas por tipo de habitación
  - name: Rate Plans
    description: Planes tarifarios por tipo de habitación
  - name: Rates
    description: Tarifas diarias por plan tarifario
  - name: Room Availability
    description: Inventario de disponibilidad por tipo de habitación y fecha
  - name: Channels
    description: Canales de distribución (OTA, directo, agencia, GDS)
  - name: Services
    description: Servicios y amenities
  - name: Accommodation Policies
    description: Políticas operativas del alojamiento (horarios, huéspedes, pagos)
  - name: Accommodation Policy Translations
    description: Traducciones de las reglas de la casa por idioma
  - name: Accommodation Rate Policies
    description: Políticas de tarifas y cancelación por tipo de tarifa
  - name: Bookings
    description: Pre-reservas iniciadas por el huésped (flujo de dos pasos)
  - name: Reservations
    description: Reservas confirmadas con huésped, canal y estado
  - name: Inquiries
    description: Consultas (leads) enviadas desde el motor web del alojamiento

# ===========================================================================
# PATHS — cada sección es un $ref al archivo de dominio correspondiente
# ===========================================================================

paths:

  # Accommodations
  /accommodations:
    $ref: './openapi/accommodations.yaml#/collection'
  /accommodation/{slug}:
    $ref: './openapi/accommodations.yaml#/item-by-slug'
  /accommodations/{id}:
    $ref: './openapi/accommodations.yaml#/item'
  /accommodations/types:
    $ref: './openapi/accommodations.yaml#/types'
  /accommodations/{id}/services:
    $ref: './openapi/accommodations.yaml#/item-services'
  /accommodations/{id}/policies:
    $ref: './openapi/accommodations.yaml#/item-policies'
  /accommodations/{id}/availability:
    $ref: './openapi/accommodations.yaml#/item-availability'

  # Accommodation Services
  /accommodation-services:
    $ref: './openapi/accommodations.yaml#/accommodation-services-collection'
  /accommodation-services/{id}:
    $ref: './openapi/accommodations.yaml#/accommodation-services-item'
  /accommodations/{id}/services/sync:
    $ref: './openapi/accommodations.yaml#/accommodation-services-sync'

  # Rooms
  /rooms:
    $ref: './openapi/rooms.yaml#/collection'
  /rooms/{id}:
    $ref: './openapi/rooms.yaml#/item'

  # Room Types
  /room-types:
    $ref: './openapi/room-types.yaml#/collection'
  /room-types/{id}:
    $ref: './openapi/room-types.yaml#/item'

  # Room Type Descriptions
  /room-type-descriptions:
    $ref: './openapi/room-types.yaml#/descriptions-collection'
  /room-type-descriptions/{id}:
    $ref: './openapi/room-types.yaml#/descriptions-item'
  /room-types/{id}/descriptions:
    $ref: './openapi/room-types.yaml#/item-descriptions'

  # Room Type Services
  /room-type-services:
    $ref: './openapi/room-types.yaml#/services-collection'
  /room-type-services/{id}:
    $ref: './openapi/room-types.yaml#/services-item'
  /room-types/{id}/services:
    $ref: './openapi/room-types.yaml#/item-services'

  # Room Type Beds
  /room-type-beds:
    $ref: './openapi/room-types.yaml#/beds-collection'
  /room-type-beds/{id}:
    $ref: './openapi/room-types.yaml#/beds-item'

  # Rate Plans
  /rate-plans:
    $ref: './openapi/rate-plans.yaml#/collection'
  /rate-plans/{id}:
    $ref: './openapi/rate-plans.yaml#/item'

  # Rates
  /rates:
    $ref: './openapi/rates.yaml#/collection'
  /rates/{id}:
    $ref: './openapi/rates.yaml#/item'

  # Room Availability
  /room-availability:
    $ref: './openapi/room-availability.yaml#/collection'
  /room-availability/{id}:
    $ref: './openapi/room-availability.yaml#/item'

  # Channels
  /channels:
    $ref: './openapi/channels.yaml#/collection'
  /channels/{id}:
    $ref: './openapi/channels.yaml#/item'

  # Services
  /services:
    $ref: './openapi/services.yaml#/collection'
  /services/{id}:
    $ref: './openapi/services.yaml#/item'

  # Accommodation Policies
  /accommodation-policies:
    $ref: './openapi/accommodation-policies.yaml#/collection'
  /accommodation-policies/{id}:
    $ref: './openapi/accommodation-policies.yaml#/item'

  # Accommodation Policy Translations
  /accommodation-policy-translations:
    $ref: './openapi/accommodation-policies.yaml#/translations-collection'
  /accommodation-policy-translations/{id}:
    $ref: './openapi/accommodation-policies.yaml#/translations-item'

  # Accommodation Rate Policies
  /accommodation-rate-policies:
    $ref: './openapi/accommodation-policies.yaml#/rate-policies-collection'
  /accommodation-rate-policies/{id}:
    $ref: './openapi/accommodation-policies.yaml#/rate-policies-item'

  # Bookings
  /booking:
    $ref: './openapi/bookings.yaml#/booking'
  /bookings:
    $ref: './openapi/bookings.yaml#/bookings-list'

  # Reservations
  /reservations:
    $ref: './openapi/bookings.yaml#/reservations'

  # Inquiries
  /inquiries:
    $ref: './openapi/inquiries.yaml#/collection'

# ===========================================================================
# COMPONENTS — todos los schemas centralizados aquí
# ===========================================================================

components:

  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido en POST /api/auth/login

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }

    LimitParam:
      name: limit
      in: query
      description: Registros por página (default 10, max 100)
      schema: { type: integer, default: 10, maximum: 100 }

    OffsetParam:
      name: offset
      in: query
      schema: { type: integer, default: 0 }

    PerPageParam:
      name: per_page
      in: query
      description: |
        Registros por página en los endpoints que usan `paginate()`
        (Reservations, Inquiries). **Sin tope**: el valor se toma tal cual.
      schema: { type: integer, default: 25 }

    PageParam:
      name: page
      in: query
      description: Número de página (estándar de `paginate()` de Laravel)
      schema: { type: integer, default: 1 }

  responses:
    ValidationError:
      description: Error de validación
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: "The given data was invalid." }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }

  schemas:

    # -----------------------------------------------------------------------
    # ACCOMMODATION
    # -----------------------------------------------------------------------
    AccommodationResource:
      type: object
      properties:
        id:               { type: integer, example: 1 }
        slug:             { type: string, example: "hotel-ignite-bariloche" }
        logo:             { type: string, nullable: true }
        name:             { type: string, example: "Hotel Ignite Bariloche" }
        address:          { type: string, nullable: true, example: "Av. San Martín 450" }
        state:            { type: string, nullable: true, example: "Río Negro" }
        city:             { type: string, nullable: true, example: "Bariloche" }
        email:            { type: string, format: email, nullable: true }
        phone:            { type: string, nullable: true }
        type:             { type: string, nullable: true, example: "Hotel 4 estrellas" }
        type_id:          { type: integer, nullable: true }
        latitude:         { type: number, format: float, nullable: true }
        longitude:        { type: number, format: float, nullable: true }
        allow_bookings:
          type: integer
          enum: [0, 1]
          description: "1 si el plan_id === 1 (reservas online habilitadas)"
        images:
          type: array
          items:
            type: object
            properties:
              id:    { type: integer }
              url:   { type: string }
              alt:   { type: string, nullable: true }
              order: { type: integer }
        web:         { type: string, format: uri, nullable: true }
        enabled:     { type: boolean }
        services:
          type: array
          items: { type: object }
        description: { type: string, nullable: true }
        rooms:
          $ref: '#/components/schemas/RoomTypeCollection'

    AccommodationCollection:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AccommodationResource' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    StoreAccommodationRequest:
      type: object
      required: [name]
      properties:
        name:               { type: string, minLength: 3, example: "Hotel Ignite" }
        account_id:         { type: integer, nullable: true }
        plan_id:            { type: integer, nullable: true }
        type_id:            { type: integer, nullable: true }
        email:              { type: string, format: email, nullable: true }
        phone:              { type: string, nullable: true, maxLength: 50 }
        email_reservations: { type: string, format: email, nullable: true }
        phone_reservations: { type: string, nullable: true, maxLength: 50 }
        web:                { type: string, format: uri, nullable: true }
        address:            { type: string, nullable: true, maxLength: 255 }
        postal_code:        { type: string, nullable: true, maxLength: 20 }
        city_id:            { type: integer, nullable: true }
        state_id:           { type: integer, nullable: true }
        country_id:         { type: string, nullable: true, maxLength: 10 }
        currency_id:        { type: string, nullable: true, maxLength: 4 }
        enabled:            { type: boolean, nullable: true }

    UpdateAccommodationRequest:
      type: object
      properties:
        name:               { type: string, minLength: 3 }
        account_id:         { type: integer, nullable: true }
        plan_id:            { type: integer, nullable: true }
        type_id:            { type: integer, nullable: true }
        email:              { type: string, format: email, nullable: true }
        phone:              { type: string, nullable: true, maxLength: 50 }
        email_reservations: { type: string, format: email, nullable: true }
        phone_reservations: { type: string, nullable: true, maxLength: 50 }
        web:                { type: string, format: uri, nullable: true }
        address:            { type: string, nullable: true, maxLength: 255 }
        postal_code:        { type: string, nullable: true, maxLength: 20 }
        city_id:            { type: integer, nullable: true }
        state_id:           { type: integer, nullable: true }
        country_id:         { type: string, nullable: true, maxLength: 10 }
        currency_id:        { type: string, nullable: true, maxLength: 4 }
        file_number:        { type: string, nullable: true, maxLength: 50 }
        tax_identification: { type: string, nullable: true, maxLength: 50 }
        channel_code:       { type: string, nullable: true, maxLength: 50 }
        bank_data:          { type: string, nullable: true }
        comment:            { type: string, nullable: true }
        enabled:            { type: boolean, nullable: true }
        active:             { type: boolean, nullable: true }
        test:               { type: boolean, nullable: true }
        expiration:         { type: string, format: date, nullable: true }

    AccommodationTypeResource:
      type: object
      properties:
        id:   { type: integer, example: 4 }
        name: { type: string, example: "Hotel 4 estrellas" }
        slug: { type: string, example: "hotel-4-estrellas" }

    AccommodationTypeCollection:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AccommodationTypeResource' } }

    AccommodationServiceResource:
      type: object
      properties:
        id:               { type: integer, example: 1 }
        accommodation_id: { type: integer, example: 1 }
        service_id:       { type: integer, example: 3 }
        accommodation:
          type: object
          nullable: true
          properties:
            id:   { type: integer }
            name: { type: string }
            slug: { type: string }
        service:
          type: object
          nullable: true
          properties:
            id:   { type: integer }
            name: { type: string }

    AccommodationServiceCollection:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AccommodationServiceResource' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    AvailabilityAvailableResponse:
      type: object
      properties:
        available:  { type: boolean, example: true }
        token:      { type: string, format: uuid, description: "UUID de un solo uso para POST /booking. Expira en 15 min." }
        nights:     { type: integer, example: 4 }
        expires_at: { type: string, format: date-time, example: "2026-08-01T14:30:00+00:00" }

    AvailabilityUnavailableResponse:
      type: object
      properties:
        available: { type: boolean, example: false }

    # -----------------------------------------------------------------------
    # Shared
    # -----------------------------------------------------------------------
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer, example: 1 }
        per_page:     { type: integer, example: 10 }
        total:        { type: integer, example: 100 }
        last_page:    { type: integer, example: 10 }

    ErrorResponse:
      type: object
      properties:
        message: { type: string }

    # -----------------------------------------------------------------------
    # ROOM
    # -----------------------------------------------------------------------
    RoomResource:
      type: object
      properties:
        id:               { type: integer, example: 1 }
        number:           { type: string, example: "101" }
        floor:            { type: integer, example: 1, nullable: true }
        status:
          type: string
          enum: [available, occupied, maintenance, blocked, checkout]
          example: available
        notes:            { type: string, nullable: true, example: "Cama extra disponible" }
        room_type_id:     { type: integer, example: 2 }
        accommodation_id: { type: integer, example: 1 }
        room_type:
          type: object
          nullable: true
          properties:
            id:            { type: integer }
            max_occupancy: { type: integer, nullable: true }
            category_id:   { type: integer, nullable: true }
        accommodation:
          type: object
          nullable: true
          properties:
            id:   { type: integer }
            name: { type: string }

    RoomCollection:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RoomResource' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    StoreRoomRequest:
      type: object
      required: [room_type_id, accommodation_id, number]
      properties:
        room_type_id:     { type: integer, example: 2 }
        accommodation_id: { type: integer, example: 1 }
        number:           { type: string, example: "101" }
        floor:            { type: integer, nullable: true, example: 1 }
        status:
          type: string
          enum: [available, occupied, maintenance, blocked, checkout]
          default: available
        notes:            { type: string, nullable: true }

    UpdateRoomRequest:
      type: object
      properties:
        number: { type: string }
        floor:  { type: integer, nullable: true }
        status:
          type: string
          enum: [available, occupied, maintenance, blocked, checkout]
        notes:  { type: string, nullable: true }

    DeletedRoomResponse:
      type: object
      properties:
        message: { type: string, example: "Room deleted successfully" }
        data:    { $ref: '#/components/schemas/RoomResource' }

    # -----------------------------------------------------------------------
    # ROOM TYPE
    # -----------------------------------------------------------------------
    RoomTypeResource:
      type: object
      properties:
        id:                 { type: integer, example: 1 }
        name:               { type: string, example: "Suite Junior", nullable: true }
        description:        { type: string, nullable: true }
        size:               { type: number, format: float, nullable: true, example: 28.5 }
        max_occupancy:      { type: integer, nullable: true, example: 3 }
        standard_occupancy: { type: integer, nullable: true, example: 2 }
        quantity:           { type: integer, nullable: true, example: 6 }
        status:
          type: string
          enum: [active, inactive, maintenance]
          nullable: true
        slug:               { type: string, nullable: true, example: "suite-junior" }
        accommodation_id:   { type: integer, example: 1 }
        category_id:        { type: integer, nullable: true }
        category:           { type: string, nullable: true, example: "Suite" }
        accommodation:
          type: object
          nullable: true
          properties:
            id:   { type: integer }
            name: { type: string }
        images:
          type: array
          items:
            type: object
            properties:
              id:    { type: integer }
              url:   { type: string }
              alt:   { type: string, nullable: true }
              order: { type: integer }
        services:
          type: array
          items: { type: object }

    RoomTypeCollection:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RoomTypeResource' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    StoreRoomTypeRequest:
      type: object
      required: [accommodation_id]
      properties:
        accommodation_id:   { type: integer, example: 1 }
        category_id:        { type: integer, nullable: true }
        slug:               { type: string, nullable: true, example: "suite-junior" }
        size:               { type: number, nullable: true, example: 28.5 }
        max_occupancy:      { type: integer, nullable: true, example: 3 }
        standard_occupancy: { type: integer, nullable: true, example: 2 }
        quantity:           { type: integer, nullable: true, example: 6 }
        status:
          type: string
          enum: [active, inactive, maintenance]
          nullable: true

    UpdateRoomTypeRequest:
      type: object
      properties:
        accommodation_id:   { type: integer }
        category_id:        { type: integer, nullable: true }
        slug:               { type: string, nullable: true }
        size:               { type: number, nullable: true }
        max_occupancy:      { type: integer, nullable: true }
        standard_occupancy: { type: integer, nullable: true }
        quantity:           { type: integer, nullable: true }
        status:
          type: string
          enum: [active, inactive, maintenance]
          nullable: true

    # -----------------------------------------------------------------------
    # ROOM TYPE DESCRIPTION
    # -----------------------------------------------------------------------
    RoomTypeDescriptionResource:
      type: object
      properties:
        id:           { type: integer }
        room_type_id: { type: integer }
        language_id:  { type: string, example: es }
        name:         { type: string }
        description:  { type: string, nullable: true }

    RoomTypeDescriptionCollection:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RoomTypeDescriptionResource' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    # -----------------------------------------------------------------------
    # ROOM TYPE BED
    # -----------------------------------------------------------------------
    RoomTypeBedResource:
      type: object
      properties:
        id:           { type: integer, example: 1 }
        room_type_id: { type: integer, example: 2 }
        type:
          type: string
          enum: [single, double, twin, queen, king, sofa_bed, bunk]
          example: queen
        quantity:     { type: integer, example: 1 }
        room_type:
          type: object
          nullable: true
          properties:
            id:            { type: integer }
            max_occupancy: { type: integer, nullable: true }

    RoomTypeBedCollection:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RoomTypeBedResource' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    StoreRoomTypeBedRequest:
      type: object
      required: [room_type_id, type]
      properties:
        room_type_id: { type: integer, example: 2 }
        type:
          type: string
          enum: [single, double, twin, queen, king, sofa_bed, bunk]
          example: queen
        quantity:
          type: integer
          minimum: 1
          maximum: 10
          default: 1

    UpdateRoomTypeBedRequest:
      type: object
      properties:
        type:
          type: string
          enum: [single, double, twin, queen, king, sofa_bed, bunk]
        quantity:
          type: integer
          minimum: 1
          maximum: 10

    DeletedRoomTypeBedResponse:
      type: object
      properties:
        message: { type: string, example: "Room type bed deleted successfully" }
        data:    { $ref: '#/components/schemas/RoomTypeBedResource' }

    # -----------------------------------------------------------------------
    # RATE PLAN
    # -----------------------------------------------------------------------
    RatePlanResource:
      type: object
      properties:
        id:                 { type: integer, example: 1 }
        room_type_id:       { type: integer, example: 2 }
        name:               { type: string, example: "Tarifa Flexible" }
        code:               { type: string, nullable: true, example: "BAR" }
        cancellation:
          type: string
          enum: [flexible, moderate, strict, non_refundable]
          example: flexible
        includes_breakfast: { type: boolean, example: false }
        enabled:            { type: boolean, example: true }
        room_type:
          type: object
          nullable: true
          properties:
            id:            { type: integer }
            max_occupancy: { type: integer, nullable: true }

    RatePlanResourceWithRates:
      allOf:
        - $ref: '#/components/schemas/RatePlanResource'
        - type: object
          properties:
            rates:
              type: array
              items:
                type: object
                properties:
                  id:       { type: integer }
                  date:     { type: string, format: date }
                  price:    { type: integer, description: "En centavos" }
                  currency: { type: string, example: ARS }
                  min_stay: { type: integer }
                  max_stay: { type: integer, nullable: true }

    RatePlanCollection:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RatePlanResource' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    StoreRatePlanRequest:
      type: object
      required: [room_type_id, name]
      properties:
        room_type_id:       { type: integer, example: 2 }
        name:               { type: string, minLength: 3, example: "Tarifa Flexible" }
        code:               { type: string, nullable: true, example: "BAR" }
        cancellation:
          type: string
          enum: [flexible, moderate, strict, non_refundable]
          default: flexible
        includes_breakfast: { type: boolean, default: false }
        enabled:            { type: boolean, default: true }

    UpdateRatePlanRequest:
      type: object
      properties:
        name:               { type: string, minLength: 3 }
        code:               { type: string, nullable: true }
        cancellation:
          type: string
          enum: [flexible, moderate, strict, non_refundable]
        includes_breakfast: { type: boolean }
        enabled:            { type: boolean }

    DeletedRatePlanResponse:
      type: object
      properties:
        message: { type: string, example: "Rate plan deleted successfully" }
        data:    { $ref: '#/components/schemas/RatePlanResource' }

