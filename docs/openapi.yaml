        no_show_penalty: { type: number, format: float, nullable: true, example: 100.00, description: "Penalización por no-show (%)" }
        accommodation:
          type: object
          nullable: true
          properties:
            id:   { type: integer }
            name: { type: string }

    AccommodationRatePolicyCollection:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AccommodationRatePolicyResource' } }
