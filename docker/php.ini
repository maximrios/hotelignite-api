[PHP]
expose_php = Off
memory_limit = 512M
max_execution_time = 120
max_input_time = 120

upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 30

; Errores: nunca al navegador, siempre al log del contenedor.
; Ojo: Laravel fuerza error_reporting(-1) al bootear, así que lo de acá solo
; aplica antes de eso. El chorro de E_DEPRECATED que producía Laravel 9 sobre
; PHP 8.4 desapareció con el upgrade a Laravel 13 (2026-08-30); se deja el
; filtro igual, que no molesta.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED
zend.assertions = -1

date.timezone = "America/Argentina/Salta"

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; El código no cambia dentro de la imagen: no revalidamos timestamps.
opcache.validate_timestamps = 0
opcache.save_comments = 1

[session]
session.cookie_httponly = On
session.cookie_secure = On
session.cookie_samesite = "Lax"
