# Borde compartido del VPS: Traefik con TLS automático.
#
#   touch acme.json && chmod 600 acme.json     # ver §"acme.json" más abajo
#   docker network create edge                 # una sola vez
#   docker compose --env-file .env.traefik -f docker-compose.traefik.yml up -d
#
# **Va aparte del stack de la API a propósito.** Los puertos 80 y 443 son únicos
# en la máquina: si Traefik viviera dentro del compose de HotelIgnite, el segundo
# proyecto que quisiera un dominio en este VPS no tendría dónde entrar, y un
# `down` de la API se llevaría puesto el borde de todos los demás.
#
# Para publicar otro proyecto no se toca este archivo: se lo cuelga de la red
# `edge` y se le ponen sus labels de router (`Host(...)` +
# `loadbalancer.server.port`). Traefik lo descubre por el socket de Docker.
#
# Lo que NO está acá y es deliberado: los middlewares de HotelIgnite (rate limit,
# in-flight, HSTS) van en el router de la API, no en el entrypoint. En el
# entrypoint se aplicarían a **todos** los proyectos del VPS, y el rate limit de
# una API JSON no es el que quiere un sitio con imágenes.
#
# ## acme.json
#
# Es un bind mount de un **archivo**, y eso tiene dos trampas que no fallan
# ruidosamente:
#
#   1. Si el archivo no existe, Docker crea un **directorio** con ese nombre.
#   2. Traefik exige permisos `600`; con cualquier otro descarta el resolver:
#      "The ACME resolve is skipped from the resolvers list ... permissions 755
#      for /letsencrypt/acme.json are too open".
#
# En los dos casos el contenedor queda `Up` y sano — lo que falla es que todos
# los sitios sirven el certificado self-signed de Traefik y el browser muestra
# advertencia. Por eso el `touch` + `chmod` va antes del primer `up`.
#
# El archivo es la única copia de los certificados. Let's Encrypt limita a 5
# emisiones por dominio por semana: perderlo puede dejarte sin TLS por días.

name: edge

services:
  traefik:
    image: traefik:v3.4
    container_name: traefik
    # `always` y no `unless-stopped`: si alguna vez se para a mano, con
    # `unless-stopped` no vuelve después de un reboot — y eso deja sin ingreso a
    # todos los proyectos del VPS, no sólo a éste.
    restart: always

    command:
      - --api.dashboard=true

      # Providers
      - --providers.docker=true
      # Nada se publica solo: cada servicio pide su router con
      # `traefik.enable=true`. En un VPS compartido esto evita exponer sin
      # querer el contenedor que alguien levante para probar algo.
      - --providers.docker.exposedbydefault=false
      # A qué red mirar cuando un contenedor está en varias. La API está en
      # `edge` y además en una red interna con MySQL y Redis; sin esto Traefik
      # tiene que adivinar a qué IP rutear y aparecen 502 intermitentes.
      - --providers.docker.network=edge

      # Entrypoints
      - --entryPoints.web.address=:80
      - --entryPoints.websecure.address=:443

      # HTTP → HTTPS
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.web.http.redirections.entryPoint.permanent=true

      # Let's Encrypt. El resolver es del borde porque el certificado lo emite
      # el borde; cada proyecto lo usa nombrándolo en su router
      # (`tls.certresolver=le`). El que se olvide de esa label sirve
      # self-signed sin error visible.
      - --certificatesResolvers.le.acme.email=${ACME_EMAIL:?falta ACME_EMAIL}
      - --certificatesResolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesResolvers.le.acme.tlsChallenge=true

      # Logs
      - --log.level=WARN
      - --accessLog=true

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Lectura del socket para descubrir contenedores. Es la pieza más
      # sensible del stack: quien comprometa Traefik puede enumerar y, en varias
      # versiones, escalar a root en el host — y ahora ve todos los proyectos
      # del VPS, no uno. La alternativa es `tecnativa/docker-socket-proxy`
      # exponiendo sólo `CONTAINERS=1`.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme.json:/letsencrypt/acme.json

    networks:
      - edge

    # `--accessLog=true` con el driver json-file por defecto crece sin techo. El
    # access log de una API pública llena el disco, y con el disco lleno se cae
    # el VPS entero, no sólo Traefik.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    labels:
      - traefik.enable=true

      # Dashboard
      - traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN:?falta DOMAIN}`)
      - traefik.http.routers.traefik-dashboard.entrypoints=websecure
      - traefik.http.routers.traefik-dashboard.tls=true
      - traefik.http.routers.traefik-dashboard.tls.certresolver=le
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard.middlewares=dashboard-auth

      # Basic Auth. El hash de bcrypt lleva `$`, y compose interpola variables
      # también **dentro del .env**: sin escapar, el hash llega truncado a
      # Traefik y la password no anda sin que nada lo reporte. En
      # `.env.traefik` va entre comillas simples. Ver ahí el detalle.
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${DASHBOARD_USERS:?falta DASHBOARD_USERS}"

networks:
  edge:
    name: edge
    external: true
