# HotelIgnite — stack de producción del API.
#
#   cd api/docker
#   cp .env.production.example .env.production && chmod 600 .env.production
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Cuatro servicios: Traefik (TLS), MySQL, Redis (cache + rate limiter) y el API
# (nginx + php-fpm + worker de colas + scheduler, todos bajo supervisord en el
# mismo contenedor — ver docker/supervisord.conf).
#
# Los backups no son un servicio: `docker/backup.sh` corre por cron en el host.
# Ver DEPLOY.md §5.

name: hotelignite-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ----------------------------------------------------------- Traefik (TLS)
  traefik:
    image: traefik:v3.3
    container_name: hi-traefik
    restart: always
    command:
      - --global.sendAnonymousUsage=false
      - --api.dashboard=false
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=hotelignite_web
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      - --entrypoints.websecure.http.middlewares=hi-secure@docker,hi-ratelimit@docker,hi-inflight@docker,hi-compress@docker
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?falta ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/letsencrypt
    networks:
      - web
    logging: *logging
    labels:
      # Middlewares que aplica el entrypoint websecure a todos los routers.
      - traefik.enable=true
      - traefik.http.middlewares.hi-compress.compress=true
      - traefik.http.middlewares.hi-secure.headers.stsSeconds=31536000
      - traefik.http.middlewares.hi-secure.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.hi-secure.headers.contentTypeNosniff=true
      - traefik.http.middlewares.hi-secure.headers.frameDeny=true
      - traefik.http.middlewares.hi-secure.headers.referrerPolicy=strict-origin-when-cross-origin
      # Rate limit en el borde, ANTES de php-fpm. El throttle de Laravel corre
      # dentro de PHP: para cuando decide rechazar, la request ya ocupó un worker
      # de los pocos que hay. Esto frena el flood en Traefik, que no bloquea.
      #
      # sourceCriterion queda en su default: la IP del socket, NO X-Forwarded-For
      # — un header no puede evadirlo.
      - traefik.http.middlewares.hi-ratelimit.ratelimit.average=${RATELIMIT_AVERAGE:-120}
      - traefik.http.middlewares.hi-ratelimit.ratelimit.burst=${RATELIMIT_BURST:-60}
      - traefik.http.middlewares.hi-ratelimit.ratelimit.period=1m
      # Tope de requests simultáneas por IP. Es el freno que importa contra el
      # ataque realista: no un flood volumétrico, sino unas pocas requests lentas
      # que ocupan todos los workers de php-fpm (pm.max_children).
      - traefik.http.middlewares.hi-inflight.inflightreq.amount=${INFLIGHT_AMOUNT:-15}

  # ----------------------------------------------------------- MySQL
  db:
    image: mysql:8.0
    container_name: hi-db
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=250
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-512M}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?falta DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:?falta DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?falta DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      TZ: ${APP_TIMEZONE:-America/Argentina/Salta}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging

  # ----------------------------------------------------------- Redis
  # Store del cache y, con él, del rate limiter de Laravel. Sobre archivos cada
  # chequeo del limiter era lectura + escritura + lock en disco; acá es atómico.
  #
  # `allkeys-lru` es correcto para cache puro. Las colas NO van acá justamente
  # por eso —evictaría jobs pendientes—: corren sobre MySQL
  # (`QUEUE_CONNECTION=database`). Si algún día se mudan a Redis, levantar una
  # segunda instancia con `noeviction`.
  redis:
    image: redis:7-alpine
    container_name: hi-redis
    restart: always
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  # ----------------------------------------------------------- API
  api:
    image: ${API_IMAGE:-hotelignite/api}:${API_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hi-api
    restart: always
    env_file:
      - .env.production
    environment:
      # Red interna: no se configuran desde el .env.
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - storage:/var/www/storage
    networks:
      - web
      - internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.docker.network=hotelignite_web
      - traefik.http.routers.hi-api.rule=Host(`${API_DOMAIN:?falta API_DOMAIN}`)
      - traefik.http.routers.hi-api.entrypoints=websecure
      - traefik.http.routers.hi-api.tls.certresolver=le
      - traefik.http.services.hi-api.loadbalancer.server.port=80

volumes:
  db_data:
  storage:
  traefik_acme:

networks:
  web:
    name: hotelignite_web
  internal:
    name: hotelignite_internal
    internal: true
