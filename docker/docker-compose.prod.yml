# HotelIgnite — stack de producción del API.
#
#   cd api/docker
#   cp .env.production.example .env.production && chmod 600 .env.production
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Tres servicios: Postgres, Redis (cache + rate limiter) y el API (nginx + php-fpm
# + worker de colas + scheduler, todos bajo supervisord en el mismo contenedor —
# ver docker/supervisord.conf).
#
# **El TLS no está acá.** Traefik vive en `docker-compose.traefik.yml`, un stack
# aparte y compartido por todos los proyectos del VPS: los puertos 80 y 443 son
# únicos en la máquina, así que si el borde fuera parte de este compose, bajar la
# API para actualizarla dejaría sin entrada a todo lo demás. Este stack se cuelga
# de la red `edge` y pide su router por labels.
#
# Orden de arranque en un VPS limpio:
#
#   docker network create edge
#   docker compose --env-file .env.traefik    -f docker-compose.traefik.yml up -d
#   docker compose --env-file .env.production -f docker-compose.prod.yml    up -d --build
#
# Los backups no son un servicio: `docker/backup.sh` corre por cron en el host.
# Ver DEPLOY.md §5.

name: hotelignite-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ----------------------------------------------------------- PostgreSQL
  # Base de la API desde el 2026-10-08 (ver docs/postgres-migration.md).
  # Parámetros chicos a propósito: el droplet tiene 957 MB y la base ronda los
  # 30 MB. `max_connections` cubre php-fpm + worker + scheduler con margen.
  # ICU es-AR: orden alfabético en español; sólo aplica al crear el volumen.
  # Imagen postgis/postgis (= postgres:17-alpine + PostGIS): las extensiones
  # postgis y unaccent las crea la migración 2026_10_08_000010. MySQL se
  # eliminó el 2026-10-08, con su volumen.
  pgsql:
    image: postgis/postgis:17-3.6-alpine
    container_name: hi-pgsql
    restart: always
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-64MB}
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
    environment:
      POSTGRES_DB: ${DB_DATABASE:?falta DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME:?falta DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=es-AR"
      TZ: ${APP_TIMEZONE:-America/Argentina/Salta}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging

  # ----------------------------------------------------------- Redis
  # Store del cache y, con él, del rate limiter de Laravel. Sobre archivos cada
  # chequeo del limiter era lectura + escritura + lock en disco; acá es atómico.
  #
  # `allkeys-lru` es correcto para cache puro. Las colas NO van acá justamente
  # por eso —evictaría jobs pendientes—: corren sobre Postgres
  # (`QUEUE_CONNECTION=database`). Si algún día se mudan a Redis, levantar una
  # segunda instancia con `noeviction`.
  redis:
    image: redis:7-alpine
    container_name: hi-redis
    restart: always
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  # ----------------------------------------------------------- API
  api:
    image: ${API_IMAGE:-hotelignite/api}:${API_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hi-api
    restart: always
    env_file:
      - .env.production
    environment:
      # Red interna: no se configuran desde el .env.
      # El motor también lo fija el stack (pisa al .env): pasó a Postgres el 2026-10-08.
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - storage:/var/www/storage
    networks:
      - edge
      - internal
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.hi-api.rule=Host(`${API_DOMAIN:?falta API_DOMAIN}`)
      - traefik.http.routers.hi-api.entrypoints=websecure
      - traefik.http.routers.hi-api.tls.certresolver=le
      - traefik.http.services.hi-api.loadbalancer.server.port=80

      # Los middlewares se aplican en ESTE router, no en el entrypoint del borde.
      # En el entrypoint alcanzarían a todos los proyectos del VPS, y el límite
      # pensado para una API JSON no es el que quiere un sitio con imágenes: el
      # primer proyecto en levantarse le impondría su política a los demás.
      - traefik.http.routers.hi-api.middlewares=hi-secure@docker,hi-ratelimit@docker,hi-inflight@docker,hi-compress@docker

      - traefik.http.middlewares.hi-compress.compress=true
      - traefik.http.middlewares.hi-secure.headers.stsSeconds=31536000
      - traefik.http.middlewares.hi-secure.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.hi-secure.headers.contentTypeNosniff=true
      - traefik.http.middlewares.hi-secure.headers.frameDeny=true
      - traefik.http.middlewares.hi-secure.headers.referrerPolicy=strict-origin-when-cross-origin

      # Rate limit en el borde, ANTES de php-fpm. El throttle de Laravel corre
      # dentro de PHP: para cuando decide rechazar, la request ya ocupó un worker
      # de los pocos que hay. Esto frena el flood en Traefik, que no bloquea.
      #
      # sourceCriterion queda en su default: la IP del socket, NO X-Forwarded-For
      # — un header no puede evadirlo.
      - traefik.http.middlewares.hi-ratelimit.ratelimit.average=${RATELIMIT_AVERAGE:-120}
      - traefik.http.middlewares.hi-ratelimit.ratelimit.burst=${RATELIMIT_BURST:-60}
      - traefik.http.middlewares.hi-ratelimit.ratelimit.period=1m

      # Tope de requests simultáneas por IP. Es el freno que importa contra el
      # ataque realista: no un flood volumétrico, sino unas pocas requests lentas
      # que ocupan todos los workers de php-fpm (pm.max_children).
      - traefik.http.middlewares.hi-inflight.inflightreq.amount=${INFLIGHT_AMOUNT:-15}

volumes:
  pg_data:
  storage:

networks:
  # Red compartida del VPS, creada a mano (`docker network create edge`) y
  # declarada `external` en los dos composes. Es un contrato entre proyectos:
  # renombrarla los rompe a todos, así que no la toques sin mirar quién más está
  # colgado de ella (`docker network inspect edge`).
  edge:
    name: edge
    external: true

  # Red privada: sólo api ↔ Postgres ↔ Redis. `internal: true` la deja sin salida a
  # internet, y Postgres no publica puertos al host. Para un cliente SQL, túnel SSH.
  internal:
    name: hotelignite_internal
    internal: true
