# nginx de producción. Traefik termina TLS y proxea acá por HTTP.
map $http_x_forwarded_proto $fcgi_https {
    default "";
    https   on;
}
map $http_x_forwarded_proto $fcgi_scheme {
    default $scheme;
    http    http;
    https   https;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /var/www/public;
    index index.php;
    charset utf-8;

    client_max_body_size 64M;

    # Esto es una API JSON: no carga scripts, ni estilos, ni se embebe en ningún
    # lado. `default-src 'none'` es la política más restrictiva posible y no
    # rompe nada, porque no queda una sola vista Blade desde que se retiró el
    # scaffolding de Breeze. Traefik ya agrega HSTS, nosniff, frameDeny y
    # Referrer-Policy; esto cubre lo que falta.
    #
    # `always` es necesario: sin eso nginx omite el header en las respuestas de
    # error (4xx/5xx), que son justo las que devuelven cuerpo generado por PHP.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Healthcheck del contenedor: no llega a PHP.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Archivos publicados por Laravel (storage:link).
    location /storage/ {
        alias /var/www/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $fcgi_https;
        fastcgi_param REQUEST_SCHEME $fcgi_scheme;
        # Alineado con request_terminate_timeout de docker/php-fpm.conf.
        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        internal;
    }

    # Ningún otro .php se ejecuta.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri /index.php?$query_string;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml application/rss+xml image/svg+xml;

    error_page 404 /index.php;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
