; Los dos procesos del contenedor. Si alguno queda en FATAL, el eventlistener
; baja supervisord y docker reinicia el contenedor por su restart policy.
[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:php-fpm]
command = php-fpm --nodaemonize
autorestart = true
startretries = 3
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g "daemon off;"
autorestart = true
startretries = 3
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; Worker de colas. `QUEUE_CONNECTION=database` (ver docker/.env.production.example):
; sin esto los jobs se encolan en la tabla `jobs` y no los procesa nadie.
;
; `--max-time=3600` recicla el proceso cada hora: un worker de Laravel es un
; proceso largo que mantiene el framework en memoria, así que una fuga se
; acumula sin techo. Al reciclarse, supervisord lo vuelve a levantar.
;
; `autorestart=true` sin `startretries` bajo es a propósito: si la base todavía
; no responde al arrancar, el worker muere y reintenta hasta que responda, en
; vez de tumbar el contenedor entero por un arranque desfasado.
[program:queue-worker]
command = php /var/www/artisan queue:work --queue=default --tries=3 --backoff=10 --max-time=3600 --sleep=3
autorestart = true
priority = 30
stopwaitsecs = 70
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; Scheduler. Laravel espera un cron por minuto; acá lo hace un loop, que evita
; sumar cron al contenedor. Lo que corre hoy está en app/Console/Kernel.php:
; purga de tokens de Sanctum vencidos y de jobs fallidos viejos.
[program:scheduler]
command = sh -c 'while true; do php /var/www/artisan schedule:run --no-interaction >> /dev/stdout 2>&1; sleep 60; done'
autorestart = true
priority = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[eventlistener:quit_on_fatal]
events = PROCESS_STATE_FATAL
command = sh -c 'printf "READY\n"; while read -r line; do kill -SIGQUIT $PPID; done'
