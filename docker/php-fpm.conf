[www]
user = www-data
group = www-data
; Ojo con el caracter de comentario: este archivo lo lee el parser INI de PHP,
; que sólo entiende `;`. Una línea que empiece con `#` la toma como entrada de
; configuración sin valor y php-fpm aborta con
; "value is NULL for a ZEND_INI_PARSER_ENTRY" — el contenedor entra en loop de
; reinicio y desde afuera se ve como un 502 de Traefik.
;
; Solo escucha en loopback: nginx corre en el mismo contenedor.
listen = 127.0.0.1:9000

; max_children es el techo de requests concurrentes que el API puede atender:
; pasado ese número las demás esperan en cola. Es también la superficie del
; ataque realista — unas pocas requests lentas ocupando todos los workers— por
; lo que el middleware inFlightReq de Traefik (INFLIGHT_AMOUNT) se mantiene por
; debajo de este valor, para que ninguna IP sola pueda copar el pool.
;
; Para dimensionarlo: (RAM disponible para PHP) / (RSS real de un worker). Medilo
; con `docker stats hi-api` bajo carga; con este código ronda los 60-80 MB, así
; que 20 workers ≈ 1.5 GB. Subilo junto con la RAM del VPS, no antes.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Logs de PHP al stdout/stderr del contenedor.
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
clear_env = no

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Peticiones de más de 30s quedan registradas con su stack trace.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 30s

; Bajado de 120s a 60s (2026-08-30). Con 20 workers, una request que retiene uno
; durante dos minutos es munición gratis: 20 conexiones lentas y el API queda sin
; capacidad. 60s sigue siendo holgado para el endpoint más pesado (el export CSV).
; Tiene que ir alineado con fastcgi_read_timeout de docker/nginx.conf: si nginx
; corta antes que fpm, el cliente ve 504 mientras el worker sigue ocupado.
request_terminate_timeout = 60s
